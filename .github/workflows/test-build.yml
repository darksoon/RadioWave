name: Test-Build (signiert, ohne Release)

# Baut einen beliebigen Branch mit dem Upload-Schlüssel aus den Secrets und stellt
# APK und AAB als Artefakt bereit. Kein Tag, kein Release, keine Versionsänderung im Repo.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName für den Test-Build (z. B. 1.0.20-test)"
        required: true
        default: "test"
      version_code:
        description: "versionCode (leer = aus gradle.properties)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Keystore aus Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          for v in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "Missing secret: $v" >&2; exit 1; }
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          PROPS

      - name: Build signed APK and AAB
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        shell: bash
        run: |
          case "$VERSION_NAME" in *[!A-Za-z0-9._-]*) echo "invalid version_name" >&2; exit 1;; esac
          case "$VERSION_CODE" in *[!0-9]*) echo "invalid version_code" >&2; exit 1;; esac
          ARGS="-Papp.versionName=$VERSION_NAME"
          [ -n "$VERSION_CODE" ] && ARGS="$ARGS -Papp.versionCode=$VERSION_CODE"
          ./gradlew $ARGS :app:assembleGithubRelease :app:bundlePlayRelease --stacktrace

      - name: Signatur anzeigen
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/github/release/*.apk; do
            echo "== $f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "SHA-256|DN"
          done
          keytool -printcert -jarfile app/build/outputs/bundle/playRelease/*.aab | grep -E "SHA256|Owner"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" keystore.properties

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radiowave-${{ github.event.inputs.version_name }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          retention-days: 14
