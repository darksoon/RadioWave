name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0-rc1 or v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release?"
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION" >&2
            echo "Expected examples: v1.0.0-rc1 or v1.0.0" >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists locally: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists on origin: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION#v}" >> "$GITHUB_ENV"
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || true)
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Decode keystore from secret
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret: SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radiowave-release.keystore"

      - name: Create keystore.properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing one or more signing secrets" >&2
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/radiowave-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Update app version metadata
        shell: bash
        run: |
          CURRENT_CODE=$(grep '^app\.versionCode=' gradle.properties | cut -d'=' -f2)
          if [ -z "$CURRENT_CODE" ]; then
            echo "Missing app.versionCode in gradle.properties" >&2
            exit 1
          fi
          NEW_CODE=$((CURRENT_CODE + 1))

          if grep -q '^app\.versionName=' gradle.properties; then
            sed -i "s/^app\.versionName=.*/app.versionName=${VERSION_NAME}/" gradle.properties
          else
            echo "app.versionName=${VERSION_NAME}" >> gradle.properties
          fi

          sed -i "s/^app\.versionCode=.*/app.versionCode=${NEW_CODE}/" gradle.properties

          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          grep '^app\.version' gradle.properties

      - name: Commit release version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore(release): prepare ${VERSION_NAME}" -m "DE: Aktualisiert app.versionName auf ${VERSION_NAME} und erhoeht app.versionCode auf ${VERSION_CODE} fuer den automatischen Signed-Release-Build." -m "EN: Updates app.versionName to ${VERSION_NAME} and increments app.versionCode to ${VERSION_CODE} for the automated signed release build."

      - name: Build signed APK and Play App Bundle
        run: ./gradlew :app:assemblePlayRelease :app:bundlePlayRelease --stacktrace --build-cache

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name apksigner | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/play/release/app-play-release.apk

      - name: Rename APK
        shell: bash
        run: |
          APK_SOURCE="app/build/outputs/apk/play/release/app-play-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Release APK not found at $APK_SOURCE" >&2
            exit 1
          fi
          APK_NAME="RadioWave-${VERSION}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          echo "APK_PATH=$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify App Bundle signature
        shell: bash
        run: |
          AAB_SOURCE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          if [ ! -f "$AAB_SOURCE" ]; then
            echo "Release App Bundle not found at $AAB_SOURCE" >&2
            exit 1
          fi
          jarsigner -verify "$AAB_SOURCE"

      - name: Rename App Bundle
        shell: bash
        run: |
          AAB_SOURCE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          if [ ! -f "$AAB_SOURCE" ]; then
            echo "Release App Bundle not found at $AAB_SOURCE" >&2
            exit 1
          fi
          AAB_NAME="RadioWave-${VERSION}.aab"
          cp "$AAB_SOURCE" "$AAB_NAME"
          echo "AAB_PATH=$AAB_NAME" >> "$GITHUB_ENV"

      - name: Package native debug symbols
        shell: bash
        run: |
          set -euo pipefail

          SYMBOLS_DIR=""
          METADATA_DIR="app/build/intermediates/native_debug_metadata/playRelease/extractPlayReleaseNativeDebugMetadata/out"
          MERGED_LIBS_DIR="app/build/intermediates/merged_native_libs/playRelease/mergePlayReleaseNativeLibs/out/lib"

          if [ -d "$METADATA_DIR" ] && [ -n "$(find "$METADATA_DIR" -type f 2>/dev/null | head -1)" ]; then
            SYMBOLS_DIR="$METADATA_DIR"
          elif [ -d "$MERGED_LIBS_DIR" ] && [ -n "$(find "$MERGED_LIBS_DIR" -type f -name '*.so' 2>/dev/null | head -1)" ]; then
            SYMBOLS_DIR="$MERGED_LIBS_DIR"
          else
            echo "No native debug symbols or native libraries found to package" >&2
            exit 1
          fi

          SYMBOLS_NAME="RadioWave-${VERSION}-native-debug-symbols.zip"
          (
            cd "$SYMBOLS_DIR"
            zip -r "$GITHUB_WORKSPACE/$SYMBOLS_NAME" .
          )
          echo "SYMBOLS_PATH=$SYMBOLS_NAME" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          normalize_subject() {
            local subject="$1"
            subject="${subject#Merge pull request }"
            printf '%s' "$subject" | sed -E 's/^[a-z]+(\([^)]+\))?!?:[[:space:]]*//'
          }

          de_subject() {
            local normalized
            normalized="$(normalize_subject "$1")"
            printf '%s' "$normalized" | awk -F' / ' '{print $1}' | sed 's/[[:space:]]*$//'
          }

          append_section() {
            local title="$1"
            local content="$2"
            if [ -n "$content" ]; then
              CHANGELOG+="## ${title}"$'\n'$'\n'
              CHANGELOG+="$content"$'\n'
            fi
          }

          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          OTHER=""
          PLAY_NOTES=""
          PLAY_COUNT=0

          while IFS='|' read -r subject short_hash; do
            [ -z "$subject" ] && continue
            if [[ "$subject" =~ ^chore\(release\):[[:space:]]prepare[[:space:]] ]]; then
              continue
            fi

            normalized="$(normalize_subject "$subject")"
            de_note="$(de_subject "$subject")"
            entry="- ${normalized} (${short_hash})"

            case "$subject" in
              feat* )
                FEATURES+="$entry"$'\n'
                ;;
              fix* )
                FIXES+="$entry"$'\n'
                ;;
              perf*|refactor* )
                IMPROVEMENTS+="$entry"$'\n'
                ;;
              * )
                OTHER+="$entry"$'\n'
                ;;
            esac

            case "$subject" in
              feat*|fix*|perf*|refactor* )
                if [ -n "$de_note" ] && [ $PLAY_COUNT -lt 5 ]; then
                  PLAY_NOTES+="- ${de_note}"$'\n'
                  PLAY_COUNT=$((PLAY_COUNT + 1))
                fi
                ;;
            esac
          done < <(git log --format='%s|%h' $RANGE --no-merges)

          CHANGELOG="# RadioWave ${VERSION}"$'\n'$'\n'
          CHANGELOG+="VersionName: ${VERSION_NAME}"$'\n'
          CHANGELOG+="VersionCode: ${VERSION_CODE}"$'\n'
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG+="Changes since ${PREV_TAG}"$'\n'
          fi
          CHANGELOG+=$'\n'

          append_section "Highlights" "$FEATURES"
          append_section "Fixes" "$FIXES"
          append_section "Improvements" "$IMPROVEMENTS"
          append_section "Other" "$OTHER"

          if [ -z "$FEATURES$FIXES$IMPROVEMENTS$OTHER" ]; then
            CHANGELOG+="_No commit details available._"$'\n'
          fi

          if [ -n "$PLAY_NOTES" ]; then
            CHANGELOG+=$'\n## Play Store short notes (DE)\n\n'
            CHANGELOG+="$PLAY_NOTES"
          fi

          printf '%s\n' "$CHANGELOG" > CHANGELOG_RELEASE.md
          printf '%s\n' "$PLAY_NOTES" > PLAY_STORE_NOTES.de.txt
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Rebase release commit onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git stash push --include-untracked -m release-workflow-temp || true
          git rebase origin/main
          if git stash list | grep -q 'release-workflow-temp'; then
            git stash pop
          fi

      - name: Create and push release tag
        shell: bash
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "RadioWave ${{ env.VERSION }}"
          body: ${{ env.CHANGELOG }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
            ${{ env.SYMBOLS_PATH }}
          generate_release_notes: false

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/radiowave-release.keystore"
