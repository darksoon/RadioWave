name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0-beta.2)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release?"
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version input
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION" >&2
            echo "Expected examples: v0.1.0-beta.2 or v1.0.0" >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists locally: $VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists on origin: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION#v}" >> "$GITHUB_ENV"
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || true)
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Decode keystore from secret
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret: SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radiowave-release.keystore"

      - name: Create keystore.properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing one or more signing secrets" >&2
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/radiowave-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Update app version metadata
        shell: bash
        run: |
          CURRENT_CODE=$(grep '^app\.versionCode=' gradle.properties | cut -d'=' -f2)
          if [ -z "$CURRENT_CODE" ]; then
            echo "Missing app.versionCode in gradle.properties" >&2
            exit 1
          fi
          NEW_CODE=$((CURRENT_CODE + 1))

          if grep -q '^app\.versionName=' gradle.properties; then
            sed -i "s/^app\.versionName=.*/app.versionName=${VERSION_NAME}/" gradle.properties
          else
            echo "app.versionName=${VERSION_NAME}" >> gradle.properties
          fi

          sed -i "s/^app\.versionCode=.*/app.versionCode=${NEW_CODE}/" gradle.properties

          echo "VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          grep '^app\.version' gradle.properties

      - name: Commit release version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore(release): prepare ${VERSION_NAME}" -m "DE: Aktualisiert app.versionName auf ${VERSION_NAME} und erhoeht app.versionCode auf ${VERSION_CODE} fuer den automatischen Signed-Release-Build." -m "EN: Updates app.versionName to ${VERSION_NAME} and increments app.versionCode to ${VERSION_CODE} for the automated signed release build."

      - name: Build signed GitHub APK and Play App Bundle
        run: ./gradlew :app:assembleGithubRelease :app:bundlePlayRelease --stacktrace --build-cache

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name apksigner | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/github/release/app-github-release.apk

      - name: Rename APK
        shell: bash
        run: |
          APK_SOURCE="app/build/outputs/apk/github/release/app-github-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Release APK not found at $APK_SOURCE" >&2
            exit 1
          fi
          APK_NAME="RadioWave-${VERSION}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          echo "APK_PATH=$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify App Bundle signature
        shell: bash
        run: |
          AAB_SOURCE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          if [ ! -f "$AAB_SOURCE" ]; then
            echo "Release App Bundle not found at $AAB_SOURCE" >&2
            exit 1
          fi
          jarsigner -verify "$AAB_SOURCE"

      - name: Rename App Bundle
        shell: bash
        run: |
          AAB_SOURCE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          if [ ! -f "$AAB_SOURCE" ]; then
            echo "Release App Bundle not found at $AAB_SOURCE" >&2
            exit 1
          fi
          AAB_NAME="RadioWave-${VERSION}.aab"
          cp "$AAB_SOURCE" "$AAB_NAME"
          echo "AAB_PATH=$AAB_NAME" >> "$GITHUB_ENV"

      - name: Generate changelog
        shell: bash
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log --pretty=format:"- %s (%h)" $RANGE)
          CHANGELOG="## RadioWave ${VERSION}"$'\n'$'\n'

          if [ -n "$COMMITS" ]; then
            CHANGELOG+="$COMMITS"$'\n'
          else
            CHANGELOG+="_Keine Commit-Details verfuegbar._"$'\n'
          fi

          CHANGELOG+=$'\n---\n'
          CHANGELOG+="APK: Signed Release Build"$'\n'
          CHANGELOG+="VersionName: ${VERSION_NAME}"$'\n'
          CHANGELOG+="VersionCode: ${VERSION_CODE}"$'\n'

          echo "$CHANGELOG" > CHANGELOG_RELEASE.md
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create and push release tag
        shell: bash
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "RadioWave ${{ env.VERSION }}"
          body: ${{ env.CHANGELOG }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
          generate_release_notes: false

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/radiowave-release.keystore"
