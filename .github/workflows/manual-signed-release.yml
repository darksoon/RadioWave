name: Manual Signed Release Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore from secret
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret: SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radiowave-release.keystore"

      - name: Create keystore.properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "Missing secret: SIGNING_STORE_PASSWORD" >&2
            exit 1
          fi
          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Missing secret: SIGNING_KEY_ALIAS" >&2
            exit 1
          fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing secret: SIGNING_KEY_PASSWORD" >&2
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/radiowave-release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed GitHub APK and Play App Bundle
        run: ./gradlew :app:assembleGithubRelease :app:bundlePlayRelease --stacktrace --build-cache

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/github/release/
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name apksigner | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/github/release/app-github-release.apk

      - name: Verify App Bundle signature
        run: |
          ls -la app/build/outputs/bundle/playRelease/
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Upload signed APK and App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: |
            app/build/outputs/apk/github/release/app-github-release.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
