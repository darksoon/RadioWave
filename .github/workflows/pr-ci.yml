name: PR CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          # zulu, not temurin: Temurin's installer downloads the JDK tarball directly from
          # github.com/adoptium/*-binaries/releases — that host is unreachable from our
          # self-hosted runner (connect ETIMEDOUT), while GitHub's API/asset subdomains and
          # every other CDN we've checked (Azul, Amazon, BellSoft) work fine. Zulu is Azul's
          # OpenJDK build, downloaded from cdn.azul.com — functionally equivalent OpenJDK,
          # just not routed through the blocked host.
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default also installs the legacy 'tools' package, which Google
          # removed from the SDK repository — sdkmanager then fails. AGP fetches the rest.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build logic
        run: ./gradlew :build-logic:build --stacktrace --build-cache

      - name: Build (debug only)
        run: ./gradlew assembleGithubDebug --stacktrace --build-cache

      - name: Lint
        run: ./gradlew lintGithubDebug --stacktrace --build-cache

      - name: Test
        run: ./gradlew testDebugUnitTest testGithubDebugUnitTest --stacktrace --build-cache
